#配置数据源
spring:
  main:
    allow-bean-definition-overriding: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 100MB
      enabled: true
  datasource:
    dbs: one
    one:
      ip: localhost
      name: onettoo
      jdbc-url: jdbc:log4jdbc:mysql://${DB_HOST:52.83.127.15}:${DB_PORT:3306}/${DB_NAME:ONETTOO}?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false
      username: root
      password: oneAa123123!.
      driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    druid:
      db-type: com.alibaba.druid.pool.DruidDataSource
      driverClassName: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      #mysql8
      #driverClassName: com.mysql.cj.jdbc.Driver
      #mysql5,6,7
      #driverClassName: com.mysql.jdbc.Driver
      url: jdbc:log4jdbc:mysql://${DB_HOST:52.83.127.15}:${DB_PORT:3306}/${DB_NAME:four}?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false

      username: ${DB_USER:root}
      password: ${DB_PWD:112233}
      #password: ${DB_PWD:112233}
      # 初始连接数
      initial-size: 5
      # 最小连接数
      min-idle: 10
      # 最大连接数
      max-active: 20
      # 获取连接超时时间
      max-wait: 5000
      # 连接有效性检测时间
      time-between-eviction-runs-millis: 60000
      # 连接在池中最小生存的时间
      min-evictable-idle-time-millis: 300000
      # 连接在池中最大生存的时间
      max-evictable-idle-time-millis: 900000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 检测连接是否有效
      validation-query: select 1
      # 配置监控统计
      webStatFilter:
        enabled: true
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
      filter:
        stat:
          enabled: true
          # 记录慢SQL
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  redis:
    database: ${REDIS_DB:0}
    host: ${REDIS_HOST:52.83.127.15}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PWD:onettoo-redis-2023-onettoo.}
    timeout: 10000


