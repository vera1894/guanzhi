#是否开启 swagger-ui
swagger:
  enabled: true
  serverIp: 172.31.33.21

#jwt
jwt:
  header: Authorization
  # 令牌前缀
  token-start-with: Bearer
  # 必须使用最少88位的Base64对该令牌进行编码
  base64-secret: w8fL6FEJwTetFO8rhOvz6B/ugUjb1FImbRfAEfKAdKnkq9sYZ7zdr53yikgm9nVb0RdOIsntYrHjwAx+atF29w==
  # 令牌过期时间 此处单位/毫秒 ，默认24小时，可在此网站生成 https://www.convertworld.com/zh-hans/time/milliseconds.html
  token-validity-in-seconds: 86400000
  # 令牌过期时间 此处单位/毫秒 ，默认365天，可在此网站生成 https://www.convertworld.com/zh-hans/time/milliseconds.html
  token-validity-in-long-seconds: 31536000000
  # 在线用户key
  online-key: "online-token:"
  # 在线IOT设备key
  equip-key: "online-equip:"
  # 验证码
  code-key: code-key-
  # token 续期检查时间范围（默认300分钟，单位毫秒），在token即将过期的一段时间内用户操作了，则给用户的token续期
  detect: 18000000
  # 续期时间范围，默认24小时，单位毫秒
  renew: 86400000
  # 本地化语言类型
  language: Language
  # 权限 claim key
  auth-key: auth

